<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COLLABX — Platform Admin Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f5f7fb;color:#172033}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.portal{min-height:100vh;display:flex}
.side{width:250px;background:#101828;color:#fff;padding:22px 14px;position:fixed;inset:0 auto 0 0;overflow:auto}
.logo{font-size:24px;font-weight:850;padding:0 12px}.tag{font-size:11px;color:#98a2b3;padding:5px 12px 25px;line-height:1.5}
.nav button{display:block;width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px 12px;border-radius:8px;margin:3px 0}
.nav button.active,.nav button:hover{background:#1d2939;color:#fff}
.user{margin-top:28px;background:#182230;border:1px solid #293548;border-radius:9px;padding:12px;font-size:12px}
.user small{color:#98a2b3}.user button{width:100%;margin-top:9px;padding:7px;border:1px solid #344054;background:transparent;color:#fff;border-radius:7px}
.main{margin-left:250px;width:calc(100% - 250px)}
header{height:66px;background:#fff;border-bottom:1px solid #e5e9f0;padding:0 30px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.content{padding:30px;max-width:1450px;margin:auto}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}
h1{margin:0 0 5px;font-size:27px}h2{font-size:18px;margin:0 0 12px}.muted{color:#667085}
.btn{padding:10px 15px;border-radius:8px;border:1px solid #d9dee8;background:#fff;font-weight:700}.primary{background:#2457d6;color:#fff;border-color:#2457d6}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.card{background:#fff;border:1px solid #e3e8ef;border-radius:11px;padding:18px;box-shadow:0 7px 22px rgba(16,24,40,.04)}
.metric small{color:#667085}.metric strong{display:block;font-size:27px;margin:8px 0}
.two{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:13px 0;border-bottom:1px solid #e5e9f0}.row:last-child{border-bottom:0}
.badge{background:#eef2ff;color:#3547a6;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:750;white-space:nowrap}
.badge.green{background:#ecfdf3;color:#027a48}.badge.orange{background:#fffaeb;color:#b54708}.badge.red{background:#fef3f2;color:#b42318}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{padding:11px;border:1px solid #dfe5ee;background:#fff;border-radius:8px;text-align:left;font-weight:650}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select{padding:10px;border:1px solid #d9dee8;border-radius:8px;background:#fff}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #e5e9f0;font-size:13px;white-space:nowrap}.table th{color:#667085;font-size:11px;text-transform:uppercase}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d9dee8;border-radius:8px;background:#fff}.field textarea{min-height:90px;resize:vertical}
.form-actions{margin-top:15px;display:flex;gap:10px}.notice{padding:12px;border-radius:8px;background:#f7f9fc;color:#667085;font-size:13px;margin-bottom:15px}
.statline{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e5e9f0}.statline:last-child{border:0}
.progress{height:8px;background:#eef2f6;border-radius:99px;overflow:hidden;margin-top:7px}.progress span{display:block;height:100%;background:#2457d6}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.two,.form-grid{grid-template-columns:1fr}}
@media(max-width:650px){.portal{display:block}.side{position:static;width:100%}.main{margin:0;width:100%}.grid{grid-template-columns:1fr}.content{padding:16px}header{padding:0 16px}}
</style>
</head>

<main class="main">

function renderDashboard(){
document.getElementById("content").innerHTML=
`<div class="head"><div><h1>${data.Dashboard.title}</h1><p class="muted">${data.Dashboard.desc}</p></div></div>${data.Dashboard.html}`;
}
function showSection(btn,name){
document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
btn.classList.add("active");
document.getElementById("crumb").textContent=name;
document.getElementById("headerAction").textContent=name==="Dashboard"?"System Overview":"Quick Action";
const s=data[name];
document.getElementById("content").innerHTML=
`<div class="head"><div><h1>${s.title}</h1><p class="muted">${s.desc}</p></div></div>${s.html}`;
}
function showByName(name){
const buttons=[...document.querySelectorAll(".nav button")];
const btn=buttons.find(b=>b.textContent.includes(name));
if(btn)showSection(btn,name);
}
function primaryAction(){alert("Demo action for Platform Admin: "+document.getElementById("crumb").textContent);}
function logout(){sessionStorage.clear();location.href="index.html";}
function filterRows(tableId,value){
const q=value.toLowerCase();
document.querySelectorAll("#"+tableId+" tbody tr").forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?"":"none");
}
renderDashboard();
