<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Samyog — Faculty Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f5f7fb;color:#172033}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.portal{min-height:100vh;display:flex}
.side{width:250px;background:#101828;color:#fff;padding:22px 14px;position:fixed;inset:0 auto 0 0}
.logo{font-size:24px;font-weight:850;padding:0 12px}.tag{font-size:11px;color:#98a2b3;padding:5px 12px 25px;line-height:1.4}
.nav button{display:block;width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px 12px;border-radius:8px;margin:3px 0}
.nav button.active,.nav button:hover{background:#1d2939;color:#fff}
.user{position:absolute;bottom:15px;left:14px;right:14px;background:#182230;border:1px solid #293548;border-radius:9px;padding:12px;font-size:12px}
.user small{color:#98a2b3}.user button{width:100%;margin-top:9px;padding:8px;border:1px solid #344054;background:transparent;color:#fff;border-radius:7px}
.main{margin-left:250px;width:calc(100% - 250px)}
header{height:66px;background:#fff;border-bottom:1px solid #e5e9f0;padding:0 30px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.content{padding:30px;max-width:1400px;margin:auto}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}
h1{margin:0 0 6px;font-size:27px}h2{font-size:18px;margin:0 0 13px}h3{font-size:15px;margin:0 0 7px}
.muted{color:#667085}.help{font-size:13px;color:#667085;line-height:1.5}
.btn{padding:10px 15px;border-radius:8px;border:1px solid #d9dee8;background:#fff;font-weight:700}
.primary{background:#2457d6;color:#fff;border-color:#2457d6}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.card{background:#fff;border:1px solid #e3e8ef;border-radius:11px;padding:18px;box-shadow:0 7px 22px rgba(16,24,40,.04);margin-bottom:16px}
.metric small{color:#667085}.metric strong{display:block;font-size:27px;margin:8px 0}
.two{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:13px 0;border-bottom:1px solid #e5e9f0}
.row:last-child{border-bottom:0}
.badge{background:#eef2ff;color:#3547a6;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:750;white-space:nowrap}
.badge.green{background:#ecfdf3;color:#067647}.badge.orange{background:#fff7ed;color:#b54708}.badge.red{background:#fef3f2;color:#b42318}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{margin-bottom:15px}.field.full{grid-column:1/-1}
label{display:block;font-size:12px;font-weight:750;margin-bottom:7px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d9dee8;border-radius:8px;background:#fff;color:#172033}
textarea{min-height:105px;resize:vertical}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.filters input,.filters select{width:auto;min-width:180px}
.notice{padding:12px 14px;background:#f7f9fc;border-radius:8px;margin-bottom:14px;font-size:13px;line-height:1.5}
.progress{height:8px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:9px}.progress span{display:block;height:100%;background:#2457d6}
.progress-row{margin:15px 0}.progress-row>div{display:flex;justify-content:space-between;font-size:12px}
.member{display:flex;align-items:center;gap:12px}.avatar{width:36px;height:36px;border-radius:50%;background:#eef2ff;display:grid;place-items:center;font-weight:800;color:#3547a6}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.check{display:flex;gap:9px;align-items:center;font-size:13px;margin:9px 0}.check input{width:auto}
.empty{text-align:center;padding:30px;color:#667085}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.two,.profile-grid{grid-template-columns:1fr}}
@media(max-width:650px){.portal{display:block}.side{position:static;width:100%}.main{margin:0;width:100%}.user{position:static;margin-top:20px}.grid,.form-grid{grid-template-columns:1fr}.content{padding:16px}header{padding:0 16px}.filters input,.filters select{width:100%}}
</style>
</head>
<body>
<div class="portal">
<aside class="side">
<div class="logo">Samyog</div>
<div class="tag">Community → Collaborative Innovation</div>
<div class="nav">
<button class="active" onclick="showSection('dashboard',this)">🏠 Dashboard</button>
<button onclick="showSection('challenges',this)">🎯 Assigned Challenges</button>
<button onclick="showSection('projects',this)">📁 Projects</button>
<button onclick="showSection('teams',this)">👥 Teams</button>
<button onclick="showSection('milestones',this)">📅 Milestones</button>
<button onclick="showSection('profile',this)">👤 My Profile</button>
</div>
<div class="user"><small>LOGGED IN AS</small><br><b>Faculty</b><button onclick="logout()">Sign out</button></div>
</aside>

<main class="main">
<header>
<span>Faculty / <b id="crumb">Dashboard</b></span>
<button class="btn primary" onclick="showSection('challenges',document.querySelectorAll('.nav button')[1])">View Challenges</button>
</header>
<div class="content" id="content"></div>
</main>
</div>

<script>
const challengesData=[
 {title:"Smart Irrigation Monitoring",category:"Agriculture",priority:"High",status:"Assigned",deadline:"20 Sep 2026",description:"Develop a practical way to monitor soil moisture and reduce unnecessary water usage."},
 {title:"School Water Quality Monitor",category:"Water",priority:"High",status:"In Progress",deadline:"28 Sep 2026",description:"Create an affordable system for checking and reporting school water quality."},
 {title:"Solar Microgrid Reliability",category:"Energy",priority:"Medium",status:"Completed",deadline:"05 Sep 2026",description:"Improve monitoring and reliability of a community solar microgrid."}
];

const projectsData=[
 {name:"Smart Irrigation Monitoring",team:"Team GreenTech",stage:"Testing",progress:68,next:"Field testing",due:"14 Sep 2026"},
 {name:"School Water Quality Monitor",team:"Team Aqua",stage:"Prototype",progress:42,next:"Sensor calibration",due:"18 Sep 2026"},
 {name:"Solar Microgrid Reliability",team:"Team Solar",stage:"Deployment",progress:100,next:"Final report",due:"10 Sep 2026"}
];

const teamsData=[
 {name:"Team GreenTech",project:"Smart Irrigation Monitoring",students:6,lead:"Ananya Rao",status:"Active"},
 {name:"Team Aqua",project:"School Water Quality Monitor",students:5,lead:"Rahul Kumar",status:"Needs Review"},
 {name:"Team Solar",project:"Solar Microgrid Reliability",students:5,lead:"Meera Singh",status:"Active"}
];

const milestonesData=[
 {title:"Complete field testing",project:"Smart Irrigation Monitoring",due:"14 Sep 2026",status:"Due Soon"},
 {title:"Sensor calibration",project:"School Water Quality Monitor",due:"18 Sep 2026",status:"Pending"},
 {title:"Final project report",project:"Solar Microgrid Reliability",due:"10 Sep 2026",status:"Due Today"},
 {title:"Prototype demonstration",project:"School Water Quality Monitor",due:"25 Sep 2026",status:"Pending"}
];

function logout(){sessionStorage.clear();location.href="index.html";}

function showSection(section,btn){
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
 if(btn)btn.classList.add("active");
 const names={dashboard:"Dashboard",challenges:"Assigned Challenges",projects:"Projects",teams:"Teams",milestones:"Milestones",profile:"My Profile"};
 document.getElementById("crumb").textContent=names[section];
 const views={dashboard:dashboardSection,challenges:challengesSection,projects:projectsSection,teams:teamsSection,milestones:milestonesSection,profile:profileSection};
 document.getElementById("content").innerHTML=views[section]();
 window.scrollTo({top:0,behavior:"smooth"});
}

function dashboardSection(){
 return `<div class="head"><div><h1>Faculty Dashboard</h1><p class="muted">Guide student teams, review projects and keep track of upcoming work.</p></div></div>
 <div class="grid">
 <div class="card metric"><small>Assigned Challenges</small><strong>3</strong><small>2 high priority</small></div>
 <div class="card metric"><small>Active Projects</small><strong>3</strong><small>Student projects</small></div>
 <div class="card metric"><small>Students</small><strong>16</strong><small>Across your teams</small></div>
 <div class="card metric"><small>Upcoming Milestones</small><strong>4</strong><small>Next 14 days</small></div>
 </div>
 <div class="two">
 <div class="card"><h2>Projects Needing Attention</h2>
 ${projectsData.map(p=>`<div class="row"><span><b>${p.name}</b><br><small class="muted">${p.team} · ${p.stage}</small></span><span class="badge ${p.progress===100?"green":p.progress<50?"orange":""}">${p.progress}%</span></div>`).join("")}
 </div>
 <div class="card"><h2>Quick Actions</h2><p class="help">Common tasks for faculty.</p>
 <div class="actions"><button class="btn primary" onclick="showSection('challenges',document.querySelectorAll('.nav button')[1])">View Challenges</button>
 <button class="btn" onclick="showSection('teams',document.querySelectorAll('.nav button')[3])">View Teams</button>
 <button class="btn" onclick="showSection('milestones',document.querySelectorAll('.nav button')[4])">Check Milestones</button></div></div>
 </div>
 <div class="card"><h2>Upcoming Milestones</h2>${milestonesData.slice(0,3).map(m=>`<div class="row"><span><b>${m.title}</b><br><small class="muted">${m.project}</small></span><span class="badge ${m.status==="Due Today"?"red":"orange"}">${m.due}</span></div>`).join("")}</div>`;
}

function challengesSection(){
 return `<div class="head"><div><h1>Assigned Challenges</h1><p class="muted">Challenges assigned to you for mentoring and academic guidance.</p></div></div>
 <div class="notice">🎯 <b>Your role:</b> Review the challenge, guide students, connect them with resources and track their progress.</div>
 <div class="filters"><input id="challengeSearch" placeholder="Search challenges..." oninput="filterChallenges()"><select id="challengePriority" onchange="filterChallenges()"><option value="">All priorities</option><option>High</option><option>Medium</option></select></div>
 <div id="challengeList">${challengeRows(challengesData)}</div>`;
}
function challengeRows(list){
 return list.map(c=>`<div class="card"><div class="row" style="padding-top:0"><span><h3>${c.title}</h3><small class="muted">${c.category} · Deadline: ${c.deadline}</small></span><span class="badge ${c.priority==="High"?"red":""}">${c.priority}</span></div><p class="help">${c.description}</p><span class="badge">${c.status}</span><div class="actions"><button class="btn primary" onclick="alert('Demo: Challenge opened for review')">Open Challenge</button><button class="btn" onclick="alert('Demo: Students can be assigned to this challenge')">Guide Students</button></div></div>`).join("")||'<div class="card empty">No challenges found.</div>';
}
function filterChallenges(){
 const q=document.getElementById("challengeSearch").value.toLowerCase(),p=document.getElementById("challengePriority").value;
 const list=challengesData.filter(c=>(!q||(c.title+c.category+c.description).toLowerCase().includes(q))&&(!p||c.priority===p));
 document.getElementById("challengeList").innerHTML=challengeRows(list);
}

function projectsSection(){
 return `<div class="head"><div><h1>Projects</h1><p class="muted">Monitor the projects you are mentoring and see where teams need help.</p></div><button class="btn primary" onclick="alert('Demo: New project workflow')">+ Add Project</button></div>
 <div class="card">${projectsData.map(p=>`<div class="progress-row"><div><b>${p.name}</b><span>${p.progress}%</span></div><small class="muted">${p.team} · ${p.stage} · Next: ${p.next} · Due ${p.due}</small><div class="progress"><span style="width:${p.progress}%"></span></div><div class="actions"><button class="btn" onclick="alert('Demo: Open project')">Open Project</button><button class="btn" onclick="alert('Demo: Add mentor feedback')">Add Feedback</button></div></div>`).join("")}</div>`;
}

function teamsSection(){
 return `<div class="head"><div><h1>Teams</h1><p class="muted">See your student teams, team leads and current status.</p></div></div>
 <div class="card"><div class="filters"><input id="teamSearch" placeholder="Search teams or students..." oninput="filterTeams()"><select id="teamStatus" onchange="filterTeams()"><option value="">All teams</option><option>Active</option><option>Needs Review</option></select></div><div id="teamList">${teamRows(teamsData)}</div></div>`;
}
function teamRows(list){
 return list.map(t=>`<div class="row"><div class="member"><div class="avatar">${t.name.split(" ").map(x=>x[0]).slice(0,2).join("")}</div><span><b>${t.name}</b><br><small class="muted">${t.project} · ${t.students} students · Lead: ${t.lead}</small></span></div><span><span class="badge ${t.status==="Needs Review"?"orange":""}">${t.status}</span><br><button class="btn" style="margin-top:7px" onclick="alert('Demo: Team details opened')">View Team</button></span></div>`).join("")||'<div class="empty">No teams found.</div>';
}
function filterTeams(){
 const q=document.getElementById("teamSearch").value.toLowerCase(),s=document.getElementById("teamStatus").value;
 const list=teamsData.filter(t=>(!q||(t.name+t.project+t.lead).toLowerCase().includes(q))&&(!s||t.status===s));
 document.getElementById("teamList").innerHTML=teamRows(list);
}

function milestonesSection(){
 return `<div class="head"><div><h1>Milestones</h1><p class="muted">Track important project deadlines and review student progress.</p></div></div>
 <div class="notice">📅 <b>Tip:</b> Review milestones marked “Due Today” or “Due Soon” first.</div>
 <div class="card"><div class="filters"><select id="milestoneFilter" onchange="filterMilestones()"><option value="">All milestones</option><option>Due Today</option><option>Due Soon</option><option>Pending</option></select></div><div id="milestoneList">${milestoneRows(milestonesData)}</div></div>`;
}
function milestoneRows(list){
 return list.map(m=>`<div class="row"><span><b>${m.title}</b><br><small class="muted">${m.project} · Due ${m.due}</small></span><span><span class="badge ${m.status==="Due Today"?"red":m.status==="Due Soon"?"orange":""}">${m.status}</span><br><button class="btn" style="margin-top:7px" onclick="alert('Demo: Milestone review opened')">Review</button></span></div>`).join("")||'<div class="empty">No milestones found.</div>';
}
function filterMilestones(){
 const s=document.getElementById("milestoneFilter").value;
 document.getElementById("milestoneList").innerHTML=milestoneRows(milestonesData.filter(m=>!s||m.status===s));
}

function profileSection(){
 return `<div class="head"><div><h1>My Profile</h1><p class="muted">Manage your faculty information and mentoring preferences.</p></div></div>
 <div class="card"><form onsubmit="event.preventDefault();alert('Profile saved successfully.')">
 <div class="form-grid">
 <div class="field"><label>Full name</label><input value="Dr. Demo Faculty"></div>
 <div class="field"><label>University / Institution</label><input value="Demo University"></div>
 <div class="field"><label>Official email</label><input type="email" value="faculty@demo-university.edu"></div>
 <div class="field"><label>Department</label><input value="Computer Science & Engineering"></div>
 <div class="field"><label>Phone number</label><input value="+91 90000 00000"></div>
 <div class="field"><label>Area of expertise</label><input value="Technology & Innovation"></div>
 <div class="field full"><label>Short bio</label><textarea>Faculty mentor helping student teams turn community challenges into practical solutions.</textarea></div>
 </div>
 <h3>Notifications</h3>
 <label class="check"><input type="checkbox" checked> Notify me when a team needs review</label>
 <label class="check"><input type="checkbox" checked> Notify me about upcoming milestones</label>
 <label class="check"><input type="checkbox"> Send weekly project summary</label>
 <div class="actions"><button class="btn primary">Save Changes</button></div>
 </form></div>`;
}

showSection("dashboard",document.querySelector(".nav button"));
</script>
<script src="translator.js"></script>
</body>
</html>
