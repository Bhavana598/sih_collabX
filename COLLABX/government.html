<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Samyog — Government Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f5f7fb;color:#172033}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.portal{min-height:100vh;display:flex}
.side{width:250px;background:#101828;color:#fff;padding:22px 14px;position:fixed;inset:0 auto 0 0}
.logo{font-size:24px;font-weight:850;padding:0 12px}.tag{font-size:11px;color:#98a2b3;padding:5px 12px 25px;line-height:1.4}
.nav button{display:block;width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:10px 12px;border-radius:8px;margin:2px 0}
.nav button.active,.nav button:hover{background:#1d2939;color:#fff}
.user{position:absolute;bottom:15px;left:14px;right:14px;background:#182230;border:1px solid #293548;border-radius:9px;padding:12px;font-size:12px}
.user small{color:#98a2b3}.user button{width:100%;margin-top:9px;padding:8px;border:1px solid #344054;background:transparent;color:#fff;border-radius:7px}
.main{margin-left:250px;width:calc(100% - 250px)}
header{height:66px;background:#fff;border-bottom:1px solid #e5e9f0;padding:0 30px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.content{padding:30px;max-width:1450px;margin:auto}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}
h1{margin:0 0 6px;font-size:27px}h2{font-size:18px;margin:0 0 13px}h3{font-size:15px;margin:0 0 7px}
.muted{color:#667085}.help{font-size:13px;color:#667085;line-height:1.5}
.btn{padding:10px 15px;border-radius:8px;border:1px solid #d9dee8;background:#fff;font-weight:700}
.primary{background:#2457d6;color:#fff;border-color:#2457d6}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.card{background:#fff;border:1px solid #e3e8ef;border-radius:11px;padding:18px;box-shadow:0 7px 22px rgba(16,24,40,.04);margin-bottom:16px}
.metric small{color:#667085}.metric strong{display:block;font-size:27px;margin:8px 0}
.two{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:13px 0;border-bottom:1px solid #e5e9f0}
.row:last-child{border-bottom:0}
.badge{background:#eef2ff;color:#3547a6;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:750;white-space:nowrap}
.badge.green{background:#ecfdf3;color:#067647}.badge.orange{background:#fff7ed;color:#b54708}.badge.red{background:#fef3f2;color:#b42318}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin-bottom:15px}.field.full{grid-column:1/-1}
label{display:block;font-size:12px;font-weight:750;margin-bottom:7px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d9dee8;border-radius:8px;background:#fff;color:#172033}
textarea{min-height:100px;resize:vertical}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:7px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.filters input,.filters select{width:auto;min-width:180px}
.notice{padding:12px 14px;background:#f7f9fc;border-radius:8px;margin-bottom:14px;font-size:13px;line-height:1.5}
.progress{height:8px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;background:#2457d6}
.progress-row{margin:15px 0}.progress-row>div{display:flex;justify-content:space-between;font-size:12px}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.check{display:flex;gap:9px;align-items:center;font-size:13px;margin:9px 0}.check input{width:auto}
.small-btn{padding:7px 10px;font-size:12px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.two,.profile-grid{grid-template-columns:1fr}}
@media(max-width:650px){.portal{display:block}.side{position:static;width:100%}.main{margin:0;width:100%}.user{position:static;margin-top:20px}.grid,.form-grid{grid-template-columns:1fr}.content{padding:16px}header{padding:0 16px}.filters input,.filters select{width:100%}}
</style>
</head>
<body>
<div class="portal">
<aside class="side">
<div class="logo">Samyog</div>
<div class="tag">Community → Collaborative Innovation</div>
<div class="nav">
<button class="active" onclick="showSection('dashboard',this)">🏠 Dashboard</button>
<button onclick="showSection('problems',this)">📋 Problem Management</button>
<button onclick="showSection('validation',this)">✓ Validation Queue</button>
<button onclick="showSection('universities',this)">🎓 Universities</button>
<button onclick="showSection('industry',this)">🏢 Industry Partners</button>
<button onclick="showSection('projects',this)">📁 Projects</button>
<button onclick="showSection('map',this)">📍 District Map</button>
<button onclick="showSection('analytics',this)">📊 Analytics</button>
<button onclick="showSection('notifications',this)">🔔 Notifications</button>
<button onclick="showSection('profile',this)">👤 My Profile</button>
</div>
<div class="user"><small>LOGGED IN AS</small><br><b>Government</b><button onclick="logout()">Sign out</button></div>
</aside>

<main class="main">
<header>
<span>Government / <b id="crumb">Dashboard</b></span>
<button class="btn primary" onclick="showSection('validation',document.querySelectorAll('.nav button')[2])">Review Pending</button>
</header>
<div class="content" id="content"></div>
</main>
</div>

<script>
const problemsData=[
{title:"Farm irrigation problems",location:"Gumla",category:"Agriculture",reportedBy:"Citizen",status:"Under Review",date:"08 Sep 2026",priority:"High"},
{title:"School drinking water shortage",location:"Latehar",category:"Water",reportedBy:"Citizen",status:"Validated",date:"06 Sep 2026",priority:"High"},
{title:"Solar microgrid reliability",location:"Simdega",category:"Energy",reportedBy:"University",status:"Matched",date:"03 Sep 2026",priority:"Medium"},
{title:"Waste collection gaps",location:"Ranchi",category:"Sanitation",reportedBy:"Community",status:"In Progress",date:"01 Sep 2026",priority:"Medium"},
{title:"Village road damage",location:"Lohardaga",category:"Infrastructure",reportedBy:"Citizen",status:"Under Review",date:"30 Aug 2026",priority:"Low"}
];

const universitiesData=[
{name:"Demo University",district:"Ranchi",projects:12,students:86,status:"Active"},
{name:"State Technical University",district:"Gumla",projects:8,students:54,status:"Active"},
{name:"District Innovation College",district:"Latehar",projects:5,students:31,status:"Pending Approval"}
];

const industryData=[
{name:"AgriTech Solutions",sector:"Agriculture",projects:4,status:"Active",contact:"Industry Coordinator"},
{name:"Green Energy Labs",sector:"Energy",projects:3,status:"Active",contact:"Partnership Team"},
{name:"WaterWorks India",sector:"Water",projects:2,status:"Pending",contact:"CSR / Innovation Lead"}
];

const projectsData=[
{name:"Smart Irrigation Monitoring",location:"Gumla",partner:"AgriTech Solutions",lead:"Demo University",progress:68,status:"Testing"},
{name:"School Water Quality Monitor",location:"Latehar",partner:"WaterWorks India",lead:"State Technical University",progress:42,status:"Prototype"},
{name:"Solar Microgrid Reliability",location:"Simdega",partner:"Green Energy Labs",lead:"Demo University",progress:100,status:"Completed"},
{name:"Waste Collection Improvement",location:"Ranchi",partner:"Green City Partner",lead:"District Innovation College",progress:55,status:"Implementation"}
];

const districtsData=[
["Ranchi",62,18,24,9800],["Gumla",48,7,17,7200],["Latehar",39,3,13,6100],["Simdega",31,2,9,5400],["Lohardaga",28,1,8,4310]
];

function logout(){sessionStorage.clear();location.href="index.html";}

function showSection(section,btn){
document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
if(btn)btn.classList.add("active");
const names={dashboard:"Dashboard",problems:"Problem Management",validation:"Validation Queue",universities:"Universities",industry:"Industry Partners",projects:"Projects",map:"District Map",analytics:"Analytics",notifications:"Notifications",profile:"My Profile"};
document.getElementById("crumb").textContent=names[section];
const views={dashboard:dashboardSection,problems:problemsSection,validation:validationSection,universities:universitiesSection,industry:industrySection,projects:projectsSection,map:mapSection,analytics:analyticsSection,notifications:notificationsSection,profile:profileSection};
document.getElementById("content").innerHTML=views[section]();
window.scrollTo({top:0,behavior:"smooth"});
}

function dashboardSection(){
return `<div class="head"><div><h1>Government Dashboard</h1><p class="muted">Review community problems, coordinate partners and monitor public impact.</p></div></div>
<div class="grid">
<div class="card metric"><small>Total Problems</small><strong>248</strong><small>18 reported this month</small></div>
<div class="card metric"><small>Pending Validation</small><strong>31</strong><small>Needs attention</small></div>
<div class="card metric"><small>Active Projects</small><strong>84</strong><small>Across districts</small></div>
<div class="card metric"><small>People Benefited</small><strong>42,810</strong><small>12% increase</small></div>
</div>
<div class="two">
<div class="card"><h2>Problems Needing Attention</h2>${problemsData.slice(0,4).map(p=>`<div class="row"><span><b>${p.title}</b><br><small class="muted">${p.location} · ${p.category} · ${p.date}</small></span><span class="badge ${p.priority==="High"?"red":p.status==="In Progress"?"orange":""}">${p.status}</span></div>`).join("")}</div>
<div class="card"><h2>Quick Actions</h2><p class="help">Common government tasks.</p>
<div class="actions"><button class="btn primary" onclick="showSection('validation',document.querySelectorAll('.nav button')[2])">Review Validation</button>
<button class="btn" onclick="showSection('problems',document.querySelectorAll('.nav button')[1])">Manage Problems</button>
<button class="btn" onclick="showSection('projects',document.querySelectorAll('.nav button')[5])">View Projects</button>
<button class="btn" onclick="showSection('analytics',document.querySelectorAll('.nav button')[7])">View Analytics</button></div></div>
</div>
<div class="card"><h2>District Snapshot</h2>${districtsData.slice(0,4).map(d=>`<div class="row"><span><b>${d[0]}</b><br><small class="muted">${d[1]} problems · ${d[3]} active projects</small></span><span class="badge green">${d[4].toLocaleString()} benefited</span></div>`).join("")}</div>`;
}

function problemRows(list){
return list.map((p,i)=>`<div class="card"><div class="row" style="padding-top:0"><span><h3>${p.title}</h3><small class="muted">${p.location} · ${p.category} · Reported by ${p.reportedBy} · ${p.date}</small></span><span class="badge ${p.priority==="High"?"red":p.status==="In Progress"?"orange":""}">${p.status}</span></div>
<p class="help">Priority: <b>${p.priority}</b>. Government teams can review, assign and update this problem.</p>
<div class="actions"><button class="btn primary" onclick="alert('Demo: Problem details opened')">View Details</button><button class="btn" onclick="alert('Demo: Problem assigned to a department')">Assign Department</button><button class="btn" onclick="alert('Demo: Status update opened')">Update Status</button></div></div>`).join("")||'<div class="card">No problems found.</div>';
}
function problemsSection(){
return `<div class="head"><div><h1>Problem Management</h1><p class="muted">View and manage problems reported by citizens and partner institutions.</p></div></div>
<div class="filters"><input id="problemSearch" placeholder="Search problem, area or category..." oninput="filterProblems()">
<select id="problemStatus" onchange="filterProblems()"><option value="">All statuses</option><option>Under Review</option><option>Validated</option><option>Matched</option><option>In Progress</option></select>
<select id="problemPriority" onchange="filterProblems()"><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select></div>
<div id="problemList">${problemRows(problemsData)}</div>`;
}
function filterProblems(){
const q=document.getElementById("problemSearch").value.toLowerCase(),s=document.getElementById("problemStatus").value,p=document.getElementById("problemPriority").value;
const list=problemsData.filter(x=>(!q||(x.title+x.location+x.category+x.reportedBy).toLowerCase().includes(q))&&(!s||x.status===s)&&(!p||x.priority===p));
document.getElementById("problemList").innerHTML=problemRows(list);
}

function validationSection(){
const pending=problemsData.filter(p=>p.status==="Under Review");
return `<div class="head"><div><h1>Validation Queue</h1><p class="muted">Check reported problems before they become official government challenges.</p></div></div>
<div class="notice">✓ <b>Validation means:</b> confirm that the problem is genuine, has enough information, and should be handled by the appropriate department.</div>
<div class="card"><h2>${pending.length} Problems Awaiting Review</h2>
${pending.map(p=>`<div class="row"><span><b>${p.title}</b><br><small class="muted">${p.location} · ${p.category} · ${p.reportedBy}</small></span>
<span><span class="badge red">${p.priority}</span><br><button class="btn small-btn" style="margin-top:7px" onclick="validateProblem('${p.title}')">Review</button></span></div>`).join("")}
</div>`;
}
function validateProblem(name){
if(confirm("Approve \""+name+"\" as a validated problem?"))alert("Demo: Problem validated successfully.");
}

function universitiesSection(){
return `<div class="head"><div><h1>Universities</h1><p class="muted">See participating universities and their innovation activity.</p></div><button class="btn primary" onclick="alert('Demo: Add university workflow')">+ Add University</button></div>
<div class="filters"><input id="uniSearch" placeholder="Search university or district..." oninput="filterUniversities()"></div>
<div class="card" id="uniList">${universityRows(universitiesData)}</div>`;
}
function universityRows(list){
return list.map(u=>`<div class="row"><span><b>${u.name}</b><br><small class="muted">${u.district} · ${u.projects} projects · ${u.students} students</small></span><span><span class="badge ${u.status==="Pending Approval"?"orange":"green"}">${u.status}</span><br><button class="btn small-btn" style="margin-top:7px" onclick="alert('Demo: University details opened')">View</button></span></div>`).join("");
}
function filterUniversities(){
const q=document.getElementById("uniSearch").value.toLowerCase();
document.getElementById("uniList").innerHTML=universityRows(universitiesData.filter(u=>(u.name+u.district).toLowerCase().includes(q)));
}

function industrySection(){
return `<div class="head"><div><h1>Industry Partners</h1><p class="muted">Manage organizations supporting projects, technology and implementation.</p></div><button class="btn primary" onclick="alert('Demo: Add industry partner')">+ Add Partner</button></div>
<div class="filters"><input id="industrySearch" placeholder="Search partner or sector..." oninput="filterIndustry()"><select id="industryStatus" onchange="filterIndustry()"><option value="">All statuses</option><option>Active</option><option>Pending</option></select></div>
<div class="card" id="industryList">${industryRows(industryData)}</div>`;
}
function industryRows(list){
return list.map(x=>`<div class="row"><span><b>${x.name}</b><br><small class="muted">${x.sector} · ${x.projects} projects · ${x.contact}</small></span><span><span class="badge ${x.status==="Pending"?"orange":"green"}">${x.status}</span><br><button class="btn small-btn" style="margin-top:7px" onclick="alert('Demo: Partner details opened')">View Partner</button></span></div>`).join("");
}
function filterIndustry(){
const q=document.getElementById("industrySearch").value.toLowerCase(),s=document.getElementById("industryStatus").value;
document.getElementById("industryList").innerHTML=industryRows(industryData.filter(x=>(x.name+x.sector).toLowerCase().includes(q)&&(!s||x.status===s)));
}

function projectsSection(){
return `<div class="head"><div><h1>Projects</h1><p class="muted">Monitor projects created through government, university and industry collaboration.</p></div></div>
<div class="card">${projectsData.map(p=>`<div class="progress-row"><div><b>${p.name}</b><span>${p.progress}%</span></div>
<small class="muted">${p.location} · University: ${p.lead} · Industry: ${p.partner} · ${p.status}</small>
<div class="progress"><span style="width:${p.progress}%"></span></div>
<div class="actions"><button class="btn" onclick="alert('Demo: Project details opened')">View Project</button><button class="btn" onclick="alert('Demo: Project monitoring opened')">Monitor</button></div></div>`).join("")}</div>`;
}

function mapSection(){
return `<div class="head"><div><h1>District Map</h1><p class="muted">Use this overview to identify districts with more problems or active projects.</p></div></div>
<div class="card"><div class="filters"><select><option>All districts</option>${districtsData.map(d=>`<option>${d[0]}</option>`).join("")}</select><select><option>Show all activity</option><option>Problems</option><option>Projects</option><option>People benefited</option></select></div>
${districtsData.map(d=>`<div class="row"><span><b>📍 ${d[0]}</b><br><small class="muted">${d[1]} reported problems · ${d[2]} pending validation · ${d[3]} active projects</small></span><span class="badge green">${d[4].toLocaleString()} benefited</span></div>`).join("")}</div>
<div class="notice">Map view is represented as a simple district summary in this prototype. A real implementation can connect these records to an interactive GIS map.</div>`;
}

function analyticsSection(){
return `<div class="head"><div><h1>Analytics</h1><p class="muted">Understand how problems are being reported, solved and turned into projects.</p></div></div>
<div class="grid">
<div class="card metric"><small>Problems Resolved</small><strong>126</strong><small>51% of total</small></div>
<div class="card metric"><small>Validation Rate</small><strong>87%</strong><small>Problems reviewed</small></div>
<div class="card metric"><small>University Projects</small><strong>42</strong><small>Currently active</small></div>
<div class="card metric"><small>Industry Partners</small><strong>18</strong><small>Participating</small></div>
</div>
<div class="two"><div class="card"><h2>Problem Categories</h2>
${[["Water",72],["Agriculture",58],["Infrastructure",46],["Sanitation",35],["Energy",24]].map(x=>`<div class="progress-row"><div><span>${x[0]}</span><b>${x[1]}</b></div><div class="progress"><span style="width:${x[1]}%"></span></div></div>`).join("")}</div>
<div class="card"><h2>Impact Summary</h2><div class="row"><span>People benefited</span><b>42,810</b></div><div class="row"><span>Districts active</span><b>18</b></div><div class="row"><span>Projects completed</span><b>37</b></div><div class="row"><span>Active collaborations</span><b>29</b></div></div></div>`;
}

function notificationsSection(){
return `<div class="head"><div><h1>Notifications</h1><p class="muted">Important updates that need government attention.</p></div><button class="btn" onclick="alert('Demo: Notifications marked as read')">Mark all as read</button></div>
<div class="card">
${[
["31 problems are waiting for validation","Review newly submitted problems from citizens and partner institutions.","Today","ACTION REQUIRED"],
["New industry partnership request","Green Energy Labs submitted a partnership request.","Yesterday","NEW"],
["Project milestone completed","Solar Microgrid Reliability has reached 100%.","2 days ago","INFO"],
["Monthly impact report is ready","District-level impact numbers have been updated.","4 days ago","INFO"]
].map(n=>`<div class="row"><span><b>${n[0]}</b><br><small class="muted">${n[1]} · ${n[2]}</small></span><span class="badge ${n[3]==="ACTION REQUIRED"?"red":n[3]==="NEW"?"orange":""}">${n[3]}</span></div>`).join("")}
</div>`;
}

function profileSection(){
return `<div class="head"><div><h1>My Profile</h1><p class="muted">Manage your government account and department information.</p></div></div>
<div class="card"><form onsubmit="event.preventDefault();alert('Profile saved successfully.')">
<div class="form-grid">
<div class="field"><label>Officer name</label><input value="Demo Government Officer"></div>
<div class="field"><label>Department</label><input value="District Innovation & Development"></div>
<div class="field"><label>Official email</label><input type="email" value="officer@gov-demo.in"></div>
<div class="field"><label>Phone number</label><input value="+91 90000 00000"></div>
<div class="field"><label>State</label><input value="Jharkhand"></div>
<div class="field"><label>District / Area</label><input value="Ranchi"></div>
<div class="field full"><label>Role / Responsibility</label><textarea>Coordinate community challenges, institutional collaboration and public impact programs.</textarea></div>
</div>
<h3>Notifications</h3>
<label class="check"><input type="checkbox" checked> Notify me when problems need validation</label>
<label class="check"><input type="checkbox" checked> Notify me about project milestones</label>
<label class="check"><input type="checkbox" checked> Send monthly impact reports</label>
<div class="actions"><button class="btn primary">Save Changes</button></div>
</form></div>`;
}

showSection("dashboard",document.querySelector(".nav button"));
</script>
<script src="translator.js"></script>
</body>
</html>
